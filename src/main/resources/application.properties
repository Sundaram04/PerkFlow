spring.application.name=perkflow

server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/perkflow_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:perkflow_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

logging.level.root=INFO
logging.level.com.perkflow=INFO

perkflow.environment=${PERKFLOW_ENVIRONMENT:default}
perkflow.display-name=${PERKFLOW_DISPLAY_NAME:PerkFlow}
